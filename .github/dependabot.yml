version: 2
# Once a month, each ecosystem gets one group for minor/patch updates and a separate group for major updates.
# The cooldown limits updates to versions published at least 7 days ago.
# Security updates (enabled in the repository settings) are grouped into one PR per ecosystem. The cooldown does not
# apply to them, so they may include versions published less than 7 days ago (check before merging).
# Add a block of the same shape for each language ecosystem (cargo, npm, etc.).
# Do not set target-branch: a block with it no longer applies to security updates, so they would not be grouped.
updates:
  - package-ecosystem: pip
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip-monthly:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      pip-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
